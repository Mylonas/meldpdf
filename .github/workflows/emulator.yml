name: Emulator smoke test

# Boots a real Android emulator, installs the debug APK, drives the app with
# synthetic input, and captures screenshots, logcat and frame stats. This is the
# only place the app actually RUNS in CI, so it is where crashes and ANRs get
# caught — and it doubles as the store-screenshot generator (artifacts/shots).

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Lean AOSP image on purpose: no Play Services, so this run also proves
          # the app degrades gracefully where the ads SDK cannot initialise. The
          # google_apis image is too overloaded for routine CI (Play Services
          # itself ANRs and drags dependent processes down).
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          # First the smoke test (captures screenshots), then the instrumented
          # PdfEngine tests against real PDFs on this same booted emulator. A
          # test failure fails the job; screenshots are still uploaded (always()).
          script: |
            bash .github/scripts/play.sh com.mikmy.meldpdf drag
            gradle --no-daemon connectedDebugAndroidTest

      - name: Upload screenshots, logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meldpdf-emulator
          path: |
            artifacts/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

