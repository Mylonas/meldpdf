<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeldPDF</title>
<meta name="description" content="MeldPDF — every PDF tool, on-device. Native Android version of meldpdf.com.">
<style>
  :root { --bg:#f6f8fc; --card:#fff; --ink:#1a2332; --muted:#5a6778; --rule:#e2e8f2; --brand:#1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0e1420; --card:#161e2e; --ink:#e8edf6; --muted:#9aa7bc; --rule:#263247; --brand:#60a5fa; }
  }
  :root[data-theme="dark"] { --bg:#0e1420; --card:#161e2e; --ink:#e8edf6; --muted:#9aa7bc; --rule:#263247; --brand:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:72px 16px; text-align:center; }
  .logo { width:72px; height:72px; border-radius:18px; margin:0 auto 20px; background:linear-gradient(180deg,#3b82f6,#1d4ed8); display:grid; place-items:center; font-weight:800; color:#fff; font-size:18px; box-shadow:0 4px 14px rgba(29,78,216,.35); }
  h1 { font-size:32px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 28px; }
  a.btn { display:inline-block; padding:12px 22px; border-radius:10px; background:var(--brand); color:#fff; text-decoration:none; font-weight:600; }
  .links { margin-top:28px; font-size:14px; }
  .links a { color:var(--brand); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">PDF</div>
    <h1>MeldPDF</h1>
    <p>Every PDF tool, running entirely on your device. Nothing is uploaded.</p>
    <a class="btn" href="./privacy/">Privacy Policy</a>
    <div class="links">
      <a href="https://meldpdf.com" rel="noopener">meldpdf.com</a>
    </div>
  </div>
</body>
</html>
